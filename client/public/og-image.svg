<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- background gradients -->
    <radialGradient id="aurora1" cx="0.12" cy="-0.1" r="0.7">
      <stop offset="0" stop-color="#dc5000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dc5000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="1.1" cy="1.1" r="0.6">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffedd7"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#dc5000"/>
    </linearGradient>
    <linearGradient id="planeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#dc5000"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#382416"/>
      <stop offset="1" stop-color="#0a0604"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- subtle border -->
  <rect x="32" y="32" width="1136" height="566" rx="40" ry="40" fill="none" stroke="#dc5000" stroke-opacity="0.18" stroke-width="2"/>

  <!-- decorative plane top-right -->
  <g transform="translate(900,80) rotate(-12) scale(1.4)" opacity="0.18">
    <path
      d="M0 80 L160 50 L172 62 L148 70 L168 92 L150 100 L128 80 L96 88 L108 120 L92 124 L66 96 L30 104 L0 80 Z"
      fill="#dc5000"
    />
  </g>

  <!-- logo lockup -->
  <g transform="translate(80,80)">
    <rect width="72" height="72" rx="18" fill="url(#logoBg)" stroke="#dc5000" stroke-opacity="0.5"/>
    <g transform="translate(8,12) scale(0.9)">
      <path
        d="M11 36 L51 28 L54 31 L48 33 L52 39 L48 41 L42 36 L34 38 L37 46 L33 47 L26 39 L17 41 L11 36 Z"
        fill="url(#planeFill)"
        transform="rotate(-12 32 36)"
      />
    </g>
    <text x="92" y="48" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="url(#brandText)">SkySense</text>
  </g>

  <!-- chip -->
  <g transform="translate(80,210)">
    <rect width="220" height="44" rx="22" fill="#dc5000" fill-opacity="0.18" stroke="#dc5000" stroke-opacity="0.45"/>
    <circle cx="22" cy="22" r="4" fill="#34d399"/>
    <text x="38" y="29" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#ffedd7" fill-opacity="0.85">LIVE AI CONCIERGE</text>
  </g>

  <!-- headline -->
  <text x="80" y="340" font-family="Inter, system-ui, sans-serif" font-size="88" font-weight="800" fill="#ffedd7" letter-spacing="-2">Fly smarter with</text>
  <text x="80" y="430" font-family="Inter, system-ui, sans-serif" font-size="88" font-weight="800" fill="url(#brandText)" letter-spacing="-2">SkySense AI</text>

  <!-- subhead -->
  <text x="80" y="490" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#ffedd7" fill-opacity="0.7">
    Natural-language flight search · real Amadeus fares · one-click Claude MCP setup
  </text>

  <!-- footer URL chip -->
  <g transform="translate(80,540)">
    <rect width="290" height="44" rx="22" fill="#0a0604" stroke="#dc5000" stroke-opacity="0.35"/>
    <text x="20" y="29" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#ffedd7" fill-opacity="0.8">skysense-ai.netlify.app</text>
  </g>
  <g transform="translate(390,540)">
    <rect width="180" height="44" rx="22" fill="#dc5000" fill-opacity="0.18" stroke="#dc5000" stroke-opacity="0.45"/>
    <text x="20" y="29" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#ff8a3d">⚡ 1-CLICK SETUP</text>
  </g>
</svg>
